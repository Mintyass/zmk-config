# Dongle-only config. Applied on top of corne.conf, which ZMK also picks up
# for this build (shield `corne_dongle` yields `corne` as a config/keymap
# prefix candidate, which is also how config/corne.keymap gets found).

# Distinguish the dongle from the travel build, which advertises as
# "corne-mintz" from the left half.
CONFIG_ZMK_KEYBOARD_NAME="corne-dongle"

# Advertise the HID boot interface (subclass 01 / protocol 01) and support
# HID_PROTOCOL_BOOT reports. ZMK leaves this off by default; without it the
# dongle enumerates as subclass 00 / protocol 00, which some BIOS/UEFI
# implementations will not drive. Pairs with the default HKRO report type --
# NKRO would defeat both this and F13-F24.
CONFIG_ZMK_USB_BOOT=y

# USB-powered and always the active endpoint for BIOS/UEFI, so never sleep.
# (ZMK already skips deep sleep while USB power is present -- this is belt
# and braces, and documents the intent.)
CONFIG_ZMK_SLEEP=n

# --- YADS display -----------------------------------------------------------
# No ambient light sensor on this build, so CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT
# is left at its default of `n`. Brightness is fixed at boot and adjustable
# from the keymap instead.
# YADS's board overlay enables the apds9960@39 devicetree node
# unconditionally, and Zephyr's driver defaults to `y` off the DT node, so
# turning DONGLE_SCREEN_AMBIENT_LIGHT off is not enough on its own -- the
# driver still gets built and fails its chip-ID read at boot on an empty bus.
CONFIG_APDS9960=n

CONFIG_DONGLE_SCREEN_HORIZONTAL=y
CONFIG_DONGLE_SCREEN_FLIPPED=n

# 1 = Linux glyph for the GUI modifier indicator.
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=1

# MIN/MAX bound DEFAULT, so they have to be set first.
CONFIG_DONGLE_SCREEN_MIN_BRIGHTNESS=5
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=90
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=60

# F22 toggles the screen, F23/F24 step brightness -- bind them in corne.keymap.
CONFIG_DONGLE_SCREEN_BRIGHTNESS_KEYBOARD_CONTROL=y
CONFIG_DONGLE_SCREEN_BRIGHTNESS_STEP=10

# Fade the backlight out after 10 min idle, restore on the next keystroke.
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=600

# YADS owns the idle fade. ZMK's own blank-on-idle is inherited from
# corne.conf (for the nice!views on the halves) and fights it here.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
