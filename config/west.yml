manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: m165437
      url-base: https://github.com/M165437
    - name: janpfischer
      url-base: https://github.com/janpfischer
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: nice-view-gem
      remote: m165437
      revision: v0.3.0
    # YADS dongle screen. Only compiled into builds that list the
    # `dongle_screen` shield, so the half builds are unaffected.
    - name: zmk-dongle-screen
      remote: janpfischer
      revision: 0.1.2
  self:
    path: config
