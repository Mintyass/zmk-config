# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/desk.conf
    artifact-name: desk-corne_left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/desk.conf
    artifact-name: desk-corne_right
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/travel.conf
    artifact-name: travel-corne_left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    cmake-args: -DEXTRA_CONF_FILE=../../config/travel.conf
    artifact-name: travel-corne_right
  # Prospector dongle (XIAO nRF52840) running YADS. Desk only -- it is the
  # split central, so desk-corne_left/right above build as peripherals.
  # Deliberately gets no EXTRA_CONF_FILE: desk.conf sets
  # CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n, which would demote the dongle too.
  - board: seeeduino_xiao_ble
    shield: corne_dongle dongle_screen
    artifact-name: desk-dongle
  - board: nice_nano_v2
    shield: settings_reset
  # For clearing stale bonds on the dongle when re-pairing the halves.
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset-xiao
